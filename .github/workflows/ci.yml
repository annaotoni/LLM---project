name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://teste:teste@localhost:5432/teste
      LLM_PROVIDER: ollama
      LLM_MODEL: ollama/qwen2.5:3b
      LLM_EMBEDDING_MODEL: ollama/all-minilm
      OLLAMA_BASE_URL: http://localhost:11434
      RAG_TOP_K: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes unitários e de feature
        run: pytest tests/unit tests/feature -v
        # tests/evals/ não roda no CI — precisa de Postgres+Ollama reais
